# Don't change this! Version used to track needed updates.
version = 2
# Disable getting banned from your world.
disableBanning = true
# Disable null's block breaking ability.
disableBlockBreaking = false
# Disable random jumpscares.
disableRandomJumpscares = false
# Disable spawning mobs from newer Minecraft versions.
disableNewMobSpawning = false

