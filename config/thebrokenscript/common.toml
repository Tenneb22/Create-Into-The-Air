# World configuration.

[world]
# Remove deepslate.
removeDeepslate = false
# Enable spawning void holes.
enableVoidHoles = false
# Enable removing chunks.
enableChunkRemoval = false
# Disable world eating functionality.
disableWorldEater = true
# Disable random structure spawning.
disableRandomStructures = true

# Chat configuration.

[chat]
# Enable the chat responses system.
